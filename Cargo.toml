[package]
name = "chronos-discord-bot"
version = "0.1.0"
edition = "2024"

[features]
docker = []

[dependencies]
chrono = "0.4.42"
chrono-tz = { version = "0.10.4", features = ["serde", "filter-by-regex"] }
regex = "1.12.3"
serde = "1.0.228"
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dependencies.poise]
version = "0.6.1"
features = []

[dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt-multi-thread"]
